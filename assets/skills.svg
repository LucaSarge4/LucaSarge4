<svg xmlns="http://www.w3.org/2000/svg" width="360" height="250" viewBox="0 0 360 250" fill="none" role="img" aria-labelledby="title">
  <title id="title">Skills</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2f80ed; }
    .label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #434d58; }
    .items { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6a737d; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="359" height="249" fill="#fffefe" stroke="#e4e2e2"/>

  <text x="25" y="35" class="header">Skills</text>

  <mask id="bar"><rect x="25" y="52" width="310" height="8" rx="5" fill="white"/></mask>
  <g mask="url(#bar)">
    <rect x="25" y="52" width="77.5" height="8" fill="#dd0031"/>
    <rect x="102.5" y="52" width="77.5" height="8" fill="#3c873a"/>
    <rect x="180" y="52" width="77.5" height="8" fill="#8b5cf6"/>
    <rect x="257.5" y="52" width="77.5" height="8" fill="#ff9900"/>
  </g>

  <g transform="translate(25, 90)">
    <circle cx="5" cy="-4" r="5" fill="#dd0031"/>
    <text x="17" y="0" class="label">Frontend</text>
    <text x="17" y="19" class="items">Angular · React · React Native · Next.js · Astro</text>
  </g>
  <g transform="translate(25, 132)">
    <circle cx="5" cy="-4" r="5" fill="#3c873a"/>
    <text x="17" y="0" class="label">Backend</text>
    <text x="17" y="19" class="items">Node.js · FastAPI · gRPC · GraphQL · RabbitMQ</text>
  </g>
  <g transform="translate(25, 174)">
    <circle cx="5" cy="-4" r="5" fill="#8b5cf6"/>
    <text x="17" y="0" class="label">AI &amp; ML</text>
    <text x="17" y="19" class="items">LangGraph · Agentic RAG · Tool calling · MCP</text>
  </g>
  <g transform="translate(25, 216)">
    <circle cx="5" cy="-4" r="5" fill="#ff9900"/>
    <text x="17" y="0" class="label">Data &amp; infra</text>
    <text x="17" y="19" class="items">PostgreSQL · pgvector · Redis · AWS · Docker</text>
  </g>
</svg>
